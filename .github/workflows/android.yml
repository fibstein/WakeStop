name: Android

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Default "packages" installs the obsolete "tools" package, which no longer exists.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wakestop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
